name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  # Weekly run against freshly resolved dependencies. This package allows any
  # symfony/validator ^8.1 and ships no lock file, so a new upstream release
  # reaches consumers without any commit here to trigger CI. The schedule
  # surfaces an upstream break (or a new deprecation, which phpunit.xml treats
  # as a failure) before a consumer hits it.
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]
        dependencies: [ 'highest', 'lowest' ]

    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }} deps)

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
          # The cache key hashes composer.json, which does not change between
          # scheduled runs — without a rotating suffix the weekly job would
          # restore the same vendor/ and never see a new upstream release.
          custom-cache-suffix: ${{ github.event_name == 'schedule' && format('fresh-{0}', github.run_id) || '' }}

      - name: Show resolved Symfony Validator version
        run: composer show symfony/validator | head -3

      - name: Run tests
        run: vendor/bin/phpunit

  static-analysis:
    runs-on: ubuntu-latest
    name: Static analysis

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  docs:
    runs-on: ubuntu-latest
    name: Documentation examples

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Check documentation examples
        run: php tools/check-docs.php
